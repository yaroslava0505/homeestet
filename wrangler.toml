# Cloudflare Pages configuration. The dashboard build settings (npm run build → dist) stay the same;
# this file adds the runtime settings for the Pages Function in functions/api/analyze.ts.
name = "homeestet"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Plain (non-secret) settings for the photo analysis. Secrets are NOT stored here:
# set ANTHROPIC_API_KEY in the dashboard (Workers & Pages → homeestet → Settings → Variables and secrets → Secret).
[vars]
ANALYSIS_MODEL = "claude-haiku-4-5"
ANALYSIS_DAILY_LIMIT = "100"
ANALYSIS_IP_DAILY_LIMIT = "5"

# Daily quotas need a KV namespace. Create one in the dashboard (Storage & Databases → KV → Create,
# name "homeestet-analysis"), copy its ID here and uncomment. Without it the function still works,
# only the daily caps are skipped (the Anthropic spend limit remains the hard ceiling).
# [[kv_namespaces]]
# binding = "ANALYSIS_KV"
# id = "<paste the namespace id>"

# For local development copy .dev.vars.example to .dev.vars.
