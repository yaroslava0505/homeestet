# Cloudflare Pages configuration. The dashboard build settings (npm run build → dist) stay the same;
# this file adds the runtime settings for the Pages Function in functions/api/analyze.ts.
name = "homeestet"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Secrets are NOT stored here. Set ANTHROPIC_API_KEY in the Cloudflare dashboard:
# Workers & Pages → homeestet → Settings → Variables and secrets → Add → type "Secret".
# For local development copy .dev.vars.example to .dev.vars.
